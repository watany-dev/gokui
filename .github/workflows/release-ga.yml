name: release-ga

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-beta.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "GA tag to publish (for example: v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-ga-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ inputs.tag }}'
          else
            tag='${{ github.ref_name }}'
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid GA tag format: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - run: go mod download

      - name: Run GA release gate
        run: make release-check

      - name: Record GA evidence
        run: make release-evidence-online

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          commit="$(git rev-parse HEAD)"
          date="$(git log -1 --format=%cI)"
          out_dir="$GITHUB_WORKSPACE/dist/$tag"
          ./scripts/build-release-assets.sh "$out_dir" "$tag" "$commit" "$date"

      - name: Upload release assets artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ga-release-assets-${{ steps.meta.outputs.tag }}
          path: dist/${{ steps.meta.outputs.tag }}/
          if-no-files-found: error

      - name: Upload GA evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ga-release-evidence-${{ steps.meta.outputs.tag }}
          path: |
            releases/evidence/*.md
            releases/evidence/logs/*.log
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-and-package
    environment:
      name: release

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@7a0ff3ceba563ae62824eef99c0d5490a6728ea7 # v4.1.8
        with:
          name: ga-release-assets-${{ needs.validate-and-package.outputs.tag }}
          path: dist/${{ needs.validate-and-package.outputs.tag }}

      - name: Publish GA release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-and-package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$TAG"
          out_dir="$GITHUB_WORKSPACE/dist/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease=false --latest --title "$tag"
            gh release upload "$tag" "$out_dir"/* --clobber
          else
            gh release create "$tag" "$out_dir"/* \
              --title "$tag" \
              --generate-notes \
              --latest
          fi
