name: Bug report
description: Something broke — a crash, wrong exit code, malformed output, or incorrect behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For suspected detection bypasses (a malicious bundle that gokui passes),
        please use private vulnerability reporting instead — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: gokui version
      description: Output of `gokui --version` (or the commit hash for source builds).
      placeholder: v0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / architecture
      placeholder: linux/amd64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and the full output (stdout and stderr).
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        If the bug involves a skill bundle, include the smallest SKILL.md (or
        directory layout) that reproduces it. Redact anything sensitive.
      render: markdown
