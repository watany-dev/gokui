name: Feature request
description: Propose a new capability, rule category, output format, or workflow improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check ROADMAP.md first — your idea may already be planned, and
        referencing the relevant section helps triage.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what threat is not covered?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should gokui do? For new rules, include example content the rule should flag.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or why existing rules/profiles don't fit.
